<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stroke Trace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f4f5f7;
    font-family: system-ui, sans-serif;
  }

  svg {
    width: min(90vw, 900px);
    height: 300px;
  }

  .word {
    font: 400 140px "Bungee", "Arial Black", sans-serif;
    fill: transparent;
    stroke: #2346d8;
    stroke-width: 1.5;
    /*
      One dash as long as the outline, offset by that same length, hides the stroke.
      700 is longer than any single glyph outline at this size.
    */
    stroke-dasharray: 700;
    stroke-dashoffset: 700;
  }

  /* Slide the dash into place to draw the outline, then fade in the fill. */
  .word.run {
    animation: draw 2.6s ease-in-out forwards, fill-in 0.7s 2.4s forwards;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  @keyframes fill-in {
    to { fill: #2346d8; }
  }

  @media (prefers-reduced-motion: reduce) {
    .word.run { animation-duration: 1ms; animation-delay: 0s; }
  }
</style>
</head>
<body>
  <div>
    <svg viewBox="0 0 900 300" aria-label="FRESH">
      <text class="word" id="word" x="50%" y="50%" text-anchor="middle" dominant-baseline="central">FRESH</text>
    </svg>
    <button type="button" id="replay">Replay</button>
  </div>

<script>
  "use strict";

  const word = document.getElementById("word");

  // Removing the class and forcing a reflow lets the animation run again.
  function replay() {
    word.classList.remove("run");
    void word.getBoundingClientRect();
    word.classList.add("run");
  }

  document.getElementById("replay").addEventListener("click", replay);
  document.fonts.load('100px "Bungee"').finally(replay);
</script>
</body>
</html>
